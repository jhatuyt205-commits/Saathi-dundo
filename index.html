
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saathi Dundo</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: #100d18;
  color: white;
  font-family: Arial, sans-serif;
}

h1 { color: #ed6197; }

.card {
  max-width: 500px;
  margin: 65px auto;
  padding: 28px 22px;
  background: #211a2b;
  border: 1px solid #51415f;
  border-radius: 25px;
  text-align: center;
}

input {
  width: 100%;
  padding: 18px;
  margin: 12px 0;
  border-radius: 15px;
  border: 1px solid #665474;
  background: #120f19;
  color: white;
  font-size: 17px;
}

button {
  width: 100%;
  padding: 18px;
  margin-top: 14px;
  border: 0;
  border-radius: 40px;
  background: #ed6197;
  color: white;
  font-size: 18px;
  font-weight: bold;
}

.login { background: #40334c; }

.hidden { display: none !important; }

#message {
  color: #ffb2d0;
  overflow-wrap: anywhere;
  margin-top: 22px;
}

.age {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 15px 0;
  text-align: left;
}

.age input {
  width: 22px;
  height: 22px;
  margin: 0;
}
</style>
</head>

<body>

<h1>❤️ Saathi Dundo</h1>

<div class="card" id="auth">
  <h2>Find Your Saathi 💗</h2>
  <p>Join our 18+ community</p>

  <input id="email" type="email" placeholder="Enter your email">

  <input id="password" type="password" placeholder="Enter password">

  <label class="age">
    <input id="age" type="checkbox">
    I confirm I am 18 or older
  </label>

  <button onclick="signup()">Create Account</button>
  <button class="login" onclick="login()">Login</button>

  <p id="message"></p>
</div>

<div class="card hidden" id="dashboard">
  <h2>Welcome to Saathi Dundo ❤️</h2>
  <p id="welcome"></p>
  <p>Your account is connected successfully!</p>
  <button onclick="logout()">Logout</button>
</div>

<script>
const SUPABASE_URL = "https://grevhaugdqftoiphetwd.supabase.co";
const SUPABASE_KEY = "sb_publishable_xYPVSCTi-7raXKmhKCdCwg_YtdyAiHH";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

function showMessage(message) {
  document.getElementById("message").textContent = message;
}

function showDashboard(session) {
  if (!session) return;

  document.getElementById("auth").classList.add("hidden");
  document.getElementById("dashboard").classList.remove("hidden");
  document.getElementById("welcome").textContent =
    "Logged in as " + session.user.email;
}

function showAuth() {
  document.getElementById("dashboard").classList.add("hidden");
  document.getElementById("auth").classList.remove("hidden");
}

window.signup = async function () {
  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const age = document.getElementById("age").checked;

    if (!email || password.length < 6) {
      throw Error("Enter valid email and password (minimum 6 characters).");
    }

    if (!age) {
      throw Error("Please confirm you are 18 or older.");
    }

    showMessage("Creating account...");

    const { data, error } = await supabaseClient.auth.signUp({
      email,
      password,
      options: {
        emailRedirectTo:
          "https://jhatuyt205-commits.github.io/Saathi-dundo/"
      }
    });

    if (error) throw error;

    if (data.session) {
      showDashboard(data.session);
    } else {
      showMessage("Account created! Verify your email, then login.");
    }
  } catch (error) {
    showMessage(error.message);
  }
};

window.login = async function () {
  try {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    if (!email || !password) {
      throw Error("Enter your email and password.");
    }

    showMessage("Logging in...");

    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

    if (error) throw error;

    showDashboard(data.session);
    showMessage("");
  } catch (error) {
    showMessage(error.message);
  }
};

window.logout = async function () {
  try {
    const { error } = await supabaseClient.auth.signOut();
    if (error) throw error;

    showAuth();
    showMessage("You have logged out.");
  } catch (error) {
    showMessage(error.message);
  }
};

async function initializeAuth() {
  try {
    const { data, error } =
      await supabaseClient.auth.getSession();

    if (error) throw error;

    if (data.session) {
      showDashboard(data.session);
    }

    supabaseClient.auth.onAuthStateChange((event, session) => {
      if (session) {
        showDashboard(session);
      } else if (event === "SIGNED_OUT") {
        showAuth();
      }
    });
  } catch (error) {
    showMessage("Connection error: " + error.message);
  }
}

initializeAuth();
</script>

</body>
</html>
