
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saathi Dundo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101522;color:white;font-family:Arial,sans-serif;padding:25px}
.container{max-width:420px;margin:45px auto;background:#1c2638;padding:25px;border-radius:18px}
h1{text-align:center;color:#ff6685}
input{width:100%;padding:14px;margin:9px 0;border:0;border-radius:9px;font-size:16px}
button{width:100%;padding:14px;margin-top:12px;border:0;border-radius:9px;background:#ff6685;color:white;font-size:16px;font-weight:bold}
#dashboard{display:none}
#message{text-align:center;color:#ffd1dc;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="container">
<h1>Saathi Dundo ❤️</h1>

<div id="auth">
<h2>Welcome</h2>
<input id="email" type="email" placeholder="Email address">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Create Account</button>
<button onclick="login()">Login</button>
</div>

<div id="dashboard">
<h2>Welcome to Saathi Dundo!</h2>
<p id="userEmail"></p>
<p>Your account is logged in successfully.</p>
<button onclick="logout()">Logout</button>
</div>

<p id="message"></p>
</div>

<script>
const SUPABASE_URL = "https://grevhaugdqftoiphetwd.supabase.co";
const SUPABASE_KEY = "sb_publishable_xYPVSCTi-7raXKmhKCdCwg_YtdyAiHH";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

const message = document.getElementById("message");

function showMessage(text){
  message.textContent = text;
}

function showDashboard(user){
  document.getElementById("auth").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.getElementById("userEmail").textContent = user.email;
  showMessage("Login successful!");
}

function showLogin(){
  document.getElementById("auth").style.display = "block";
  document.getElementById("dashboard").style.display = "none";
}

async function signup(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    showMessage("Email aur password bharo.");
    return;
  }

  showMessage("Creating account...");

  try{
    const {data,error} = await supabaseClient.auth.signUp({
      email:email,
      password:password
    });

    if(error) throw error;

    if(data.session){
      showDashboard(data.session.user);
    }else{
      showMessage("Account created! Email verification link check karo.");
    }
  }catch(error){
    showMessage(error.message);
  }
}

async function login(){
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!email || !password){
    showMessage("Email aur password bharo.");
    return;
  }

  showMessage("Logging in...");

  try{
    const {data,error} = await supabaseClient.auth.signInWithPassword({
      email:email,
      password:password
    });

    if(error) throw error;
    showDashboard(data.user);
  }catch(error){
    showMessage(error.message);
  }
}

async function logout(){
  showMessage("Logging out...");
  const {error} = await supabaseClient.auth.signOut();

  if(error){
    showMessage(error.message);
    return;
  }

  showLogin();
  showMessage("Logged out successfully.");
}

async function checkSession(){
  try{
    const {data,error} = await supabaseClient.auth.getSession();
    if(error) throw error;

    if(data.session){
      showDashboard(data.session.user);
    }
  }catch(error){
    showMessage(error.message);
  }
}

checkSession();
</script>
</body>
</html>
