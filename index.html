
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saathi Dundo</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101421;color:white;font-family:Arial;text-align:center;padding:25px}
h1,h2,h3{color:#e47798}
nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:30px 0}
button{border:0;border-radius:18px;padding:16px 22px;background:#df7295;color:white;font-size:17px;font-weight:bold;margin:6px}
input,textarea{display:block;width:100%;padding:14px;margin:10px 0;border-radius:10px;border:0}
.panel{background:#222a3d;padding:25px;border-radius:25px;max-width:700px;margin:20px auto}
.person{background:#343449;padding:25px;border-radius:20px;margin:15px 0}
.hidden{display:none}
</style>
</head>
<body>
<h1>❤️ Saathi Dundo</h1>

<div id="auth" class="panel">
<h2>Login / Signup</h2>
<input id="email" type="email" placeholder="Email">
<input id="password" type="password" placeholder="Password">
<button onclick="signup()">Signup</button>
<button onclick="login()">Login</button>
<p id="message"></p>
</div>

<div id="app" class="hidden">
<nav>
<button onclick="showTab('discover')">Discover</button>
<button onclick="showTab('likes')">Likes</button>
<button onclick="showTab('matches')">Matches</button>
<button onclick="showTab('profile')">Profile</button>
<button onclick="logout()">Logout</button>
</nav>

<section id="discover" class="panel">
<h2>Discover ❤️</h2>
<div id="people">Loading profiles...</div>
</section>

<section id="likes" class="panel hidden"><h2>Likes</h2><div id="likesList"></div></section>
<section id="matches" class="panel hidden"><h2>Matches</h2><div id="matchesList"></div></section>

<section id="profile" class="panel hidden">
<h2>My Profile</h2>
<input id="name" placeholder="Your name">
<input id="age" type="number" placeholder="Age (18+)">
<textarea id="bio" placeholder="About you"></textarea>
<button onclick="saveProfile()">Save Profile</button>
<p id="profileMessage"></p>
</section>
</div>

<script>
const SUPABASE_URL="https://grevhaugdqftoiphetwd.supabase.co";
const SUPABASE_KEY="sb_publishable_xYPVSCTi-7raXKmhKCdCwg_YtdyAiHH";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null;
let profiles=[];

function msg(t){document.getElementById("message").textContent=t}

async function signup(){
const {error}=await client.auth.signUp({
email:document.getElementById("email").value,
password:document.getElementById("password").value
});
msg(error?error.message:"Signup successful. Login now.");
}

async function login(){
const {data,error}=await client.auth.signInWithPassword({
email:document.getElementById("email").value,
password:document.getElementById("password").value
});
if(error)return msg(error.message);
currentUser=data.user;
showApp();
}

function showApp(){
document.getElementById("auth").classList.add("hidden");
document.getElementById("app").classList.remove("hidden");
loadProfile();
loadPeople();
}

function showTab(tab){
["discover","likes","matches","profile"].forEach(x=>
document.getElementById(x).classList.toggle("hidden",x!==tab));
if(tab==="discover")loadPeople();
if(tab==="likes")loadLikes();
if(tab==="matches")loadMatches();
}

async function loadProfile(){
const {data}=await client.from("profiles").select("*").eq("id",currentUser.id).maybeSingle();
if(data){
document.getElementById("name").value=data.name||data.display_name||"";
document.getElementById("age").value=data.age||"";
document.getElementById("bio").value=data.bio||"";
}
}

async function saveProfile(){
const name=document.getElementById("name").value.trim();
const age=Number(document.getElementById("age").value);
const bio=document.getElementById("bio").value.trim();
if(!name||age<18)return document.getElementById("profileMessage").textContent="Name and age 18+ required.";
const {error}=await client.from("profiles").upsert({
id:currentUser.id,name,age,bio,updated_at:new Date().toISOString()
});
document.getElementById("profileMessage").textContent=error?error.message:"Profile saved!";
}

async function loadPeople(){
const box=document.getElementById("people");
box.textContent="Loading...";
const {data,error}=await client.from("profiles").select("*").neq("id",currentUser.id);
if(error){box.textContent=error.message;return}
profiles=data||[];
if(!profiles.length){box.textContent="No other profiles yet. Invite friends to join!";return}
box.innerHTML="";
profiles.forEach(p=>{
const card=document.createElement("div");
card.className="person";
const heading=document.createElement("h3");
heading.textContent=(p.name||p.display_name||"User")+(p.age?", "+p.age:"");
const bio=document.createElement("p");
bio.textContent=p.bio||"";
const like=document.createElement("button");
like.textContent="Like ❤️";
like.onclick=()=>sendLike(p.id);
card.append(heading,bio,like);
box.append(card);
});
}

async function sendLike(id){
  const {data,error}=await client.rpc("send_like",{target_user:id});
  if(error){alert(error.message);return;}
  alert(data?"It's a Match! ❤️":"Like sent! ❤️");
  loadPeople();
}



async function loadLikes(){
const {data,error}=await client.from("likes").select("*").eq("to_user",currentUser.id);
document.getElementById("likesList").textContent=error?error.message:
(data&&data.length?data.length+" people liked you":"No likes yet.");
}

async function loadMatches(){
const {data,error}=await client.from("matches").select("*");
document.getElementById("matchesList").textContent=error?error.message:
(data&&data.length?data.length+" matches found":"No matches yet.");
}

async function logout(){
await client.auth.signOut();
location.reload();
}

client.auth.getSession().then(({data})=>{
if(data.session){currentUser=data.session.user;showApp()}
});
</script>
</body>
</html>
